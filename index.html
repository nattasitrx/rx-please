<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="description" content="ร้านยาทันใจ เกมจัดยาน่ารัก ๆ เรียนรู้เรื่องยาไปพร้อมกับการเล่น">
<meta name="theme-color" content="#FF9636">
<title>Rx, Please!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Mali:wght@500;600;700&family=Pridi:wght@400;500;600&family=Sarabun:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%}
body{height:100%;margin:0;background:#3A2A33;color:#5A3E4B;font-family:"Mali","Sarabun",system-ui,sans-serif;font-size:15px;line-height:1.5;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:2px solid #FFC93C;outline-offset:2px}
#app{position:fixed;left:50%;top:50%;width:1120px;height:630px;transform:translate(-50%,-50%) scale(var(--s,1));overflow:hidden;border-radius:6px;box-shadow:0 30px 80px -30px rgba(0,0,0,.9)}
html.port #app{width:480px;height:900px}
/* ===== Rush mode: soft candy pharmacy ===== */
.rz{--ink:#5A3E4B;--pink:#FF8FAB;--pink2:#FFD3DF;--mint:#8FDCC0;--lav:#CDB4FF;--butter:#FFE29A;--sky:#BFE3FF;--wall1:#FFE4EC;--wall2:#FFF0F4;
  position:absolute;inset:0;z-index:40;overflow:hidden;color:var(--ink);font-family:"Mali","Sarabun",system-ui,sans-serif;display:grid;grid-template-rows:46px 236px minmax(0,1fr);background:var(--wall2);user-select:none;-webkit-user-select:none}
.rz[hidden]{display:none!important}
.rz>*{position:relative;z-index:1}
.rz button{font-family:inherit;color:inherit;-webkit-tap-highlight-color:transparent;cursor:pointer}
.rz-bg{position:absolute!important;inset:0;z-index:0!important;pointer-events:none;background:
  radial-gradient(circle at 20% 30%,rgba(255,255,255,.75) 0 3px,transparent 4px) 0 0/44px 44px,
  radial-gradient(circle at 70% 70%,rgba(255,255,255,.55) 0 2px,transparent 3px) 0 0/36px 36px,
  linear-gradient(180deg,var(--wall1),var(--wall2) 282px,#FBE1CF 282px,#F7D6C1)}
.rz-win{position:absolute;left:50%;top:58px;translate:-50% 0;width:170px;height:92px;border-radius:46px 46px 12px 12px;background:linear-gradient(180deg,#CFEFFF,#EAF8FF);border:6px solid #fff;box-shadow:0 4px 0 rgba(90,62,75,.08);display:flex;gap:6px;justify-content:center;align-items:flex-end;overflow:hidden;opacity:.85}
.rz-win i{width:44px;height:30px;border-radius:30px 30px 0 0;background:#BDEBC9;margin-bottom:-8px}.rz-win i+i{width:60px;height:40px;background:#A8E3B8}
.rz-shelfdeco{position:absolute;top:96px;display:flex;gap:4px;align-items:flex-end;padding:0 10px 4px;border-bottom:7px solid rgba(255,255,255,.85);opacity:.7}.rz-shelfdeco.l{left:30px}.rz-shelfdeco.r{right:30px}
.rz-shelfdeco i{width:38px;height:38px;display:block}.rz-shelfdeco svg{width:100%;height:100%}
.rz-plant{position:absolute;right:220px;top:178px;width:44px;height:58px;opacity:.85}
/* top bar */
.rz-top{display:flex;align-items:center;gap:8px;padding:7px 12px}
.rz-pill{background:#fff;border-radius:999px;padding:4px 13px;font-weight:700;font-size:14px;box-shadow:0 3px 0 rgba(90,62,75,.12);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.rz-pill.lv{background:var(--pink);color:#fff;box-shadow:0 3px 0 #E26F8D}
.rz-pill.coin{background:var(--butter)}.rz-pill.coin b{font-size:16px}.rz-pill svg{width:16px;height:16px;fill:#FFC93C}
.rz-coin{display:inline-block;width:17px;height:17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF3B0,#FFC93C 55%,#E7A92B);box-shadow:inset 0 -2px 0 rgba(0,0,0,.08);position:relative;flex:none}
.rz-coin::after{content:"฿";position:absolute;inset:0;display:grid;place-items:center;font:700 10px/1 system-ui;color:#B07A12}
.rz-coin.big{width:100%;height:100%}
.rz-prog{flex:1;height:26px;border-radius:999px;background:#fff;position:relative;box-shadow:0 3px 0 rgba(90,62,75,.12)}
.rz-prog i{position:absolute;inset:3px auto 3px 3px;max-width:calc(100% - 6px);background:linear-gradient(90deg,#9BE7C9,#6FD3B0);border-radius:999px;transition:width .35s cubic-bezier(.3,1.4,.5,1)}
.rz-prog b{position:absolute;inset:0;display:flex;align-items:center;padding-left:14px;font-size:13px}
.rz-prog em{position:absolute;top:50%;translate:-50% -50%;z-index:2}.rz-prog em svg{width:22px;height:22px;fill:#EADDE2;filter:drop-shadow(0 1px 0 #fff);transition:transform .3s}
.rz-prog em.on svg{fill:#FFC93C;animation:rzpop .5s cubic-bezier(.3,1.8,.5,1)}
.rz-combo{background:var(--lav);color:#fff;border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px;box-shadow:0 3px 0 #A98BE8}
.rz-ic{width:34px;height:34px;border-radius:50%;border:0;background:#fff;display:grid;place-items:center;box-shadow:0 3px 0 rgba(90,62,75,.15);font:700 20px/1 "Mali",sans-serif;flex:none}
.rz-ic.off{opacity:.45}.rz-ic:disabled{opacity:.3}
/* customers */
.rz-hall{display:grid;gap:6px;padding:0 10px;align-items:end;z-index:2!important}
.rz-hall.n2{grid-template-columns:repeat(2,minmax(0,220px));justify-content:center;gap:60px}.rz-hall.n3{grid-template-columns:repeat(3,minmax(0,230px));justify-content:center;gap:30px}
.rz-hall.n4{grid-template-columns:repeat(4,minmax(0,1fr))}.rz-hall.n5{grid-template-columns:repeat(5,minmax(0,1fr))}
.rz-seat{position:relative;height:236px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.rz-who{position:relative;width:132px;height:156px;margin-bottom:-8px;cursor:pointer;animation:rzbob 2.6s ease-in-out infinite;transform-origin:50% 100%}
.rz-seat:nth-child(2n) .rz-who{animation-delay:-1.1s}.rz-seat:nth-child(3n) .rz-who{animation-delay:-.6s}
.rz-who svg{width:100%;height:100%;display:block;overflow:visible}
.rz-who.enter{animation:rzenter .55s cubic-bezier(.25,1.6,.5,1)}
.rz-who.leave.happy{animation:rzhappy .9s ease forwards}.rz-who.leave.angry{animation:rzangry .9s ease forwards}
.rz-who .crown{position:absolute;left:50%;top:-6px;width:44px;translate:-50% 0;z-index:2;animation:rzbob 1.6s ease-in-out infinite}
.rz-bub{position:relative;z-index:3;margin-bottom:8px;background:#fff;border-radius:20px;padding:6px 7px 9px;display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:100%;box-shadow:0 4px 0 rgba(90,62,75,.1);cursor:pointer;animation:rzpop .45s cubic-bezier(.3,1.7,.5,1)}
.rz-bub::after{content:"";position:absolute;left:50%;bottom:-10px;translate:-50% 0;border:10px solid transparent;border-bottom:0;border-top-color:#fff}
.rz-seat.vip .rz-bub{box-shadow:0 0 0 3px #FFD84D,0 4px 0 rgba(90,62,75,.1)}
.rz-oi{width:54px;height:54px;position:relative;transition:transform .2s,opacity .3s}.rz-oi svg{width:100%;height:100%}
.rz-bub.many .rz-oi{width:46px;height:46px}
.rz-oi.ok{opacity:.45;transform:scale(.88)}.rz-oi.ok::after{content:"✓";position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:#5CC9A7;color:#fff;font:700 14px/22px system-ui;text-align:center;animation:rzpop .4s cubic-bezier(.3,1.8,.5,1)}
.rz-oi .badge{position:absolute;left:-4px;top:-4px;background:#B9A4FF;color:#fff;font-style:normal;font-weight:700;font-size:11px;border-radius:999px;padding:0 6px;box-shadow:0 2px 0 rgba(90,62,75,.15)}
.rz-oi .q{position:absolute;right:-4px;top:-6px;width:22px;height:22px;border-radius:50%;background:#FF7F9E;color:#fff;font:700 15px/22px "Mali";text-align:center;font-style:normal;animation:rzbob 1s ease-in-out infinite}
.rz-pat{flex-basis:100%;height:8px;border-radius:9px;background:#F3E6EA;overflow:hidden;margin-top:3px}
.rz-pat i{display:block;height:100%;background:#7FD8B6;border-radius:9px;transition:width .25s linear}
.rz-counter{position:absolute!important;left:0;right:0;top:268px;height:22px;z-index:2!important;pointer-events:none;background:linear-gradient(180deg,#FFFFFF 0 7px,#FFC7D5 7px 100%);border-radius:8px 8px 0 0;box-shadow:0 5px 0 rgba(90,62,75,.08)}
.rz-counter::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(90deg,#FF9DB8 0 22px,#FFE1EA 22px 44px)}
/* work zones */
.rz-work{display:grid;grid-template-columns:420px 330px minmax(0,1fr);gap:10px;padding:16px 12px 10px;min-height:0;z-index:3!important}
.rz-zone{position:relative;border-radius:24px;padding:20px 10px 10px;display:flex;flex-direction:column;justify-content:center;gap:12px;min-height:0;box-shadow:0 5px 0 rgba(90,62,75,.08)}
.rz-zone h4{position:absolute;left:14px;top:-11px;margin:0;font-size:13px;color:#fff;border-radius:999px;padding:2px 12px;box-shadow:0 3px 0 rgba(90,62,75,.12)}
.rz-zone.tab h4{background:var(--pink)}
.rz-zone.liq h4{background:#B79CFF}
.rz-zone.cold h4{background:#7FBCEB}
.rz-zone.locked h4{background:#CDBFC5}
.rz-lock{margin:auto;display:flex;flex-direction:column;align-items:center;gap:4px;color:#BBA9B1;font-weight:700;font-size:13px}.rz-lock .ghost{width:96px;height:96px;opacity:.28;filter:grayscale(1)}.rz-lock .ghost svg{width:100%;height:100%}
.rz-src{display:flex;gap:8px;flex-wrap:nowrap;justify-content:center}
.rz-jar{border:0;background:#fff;border-radius:18px;flex:0 1 82px;min-width:0;width:82px;padding:4px 2px 5px;display:flex;flex-direction:column;align-items:center;box-shadow:0 4px 0 rgba(90,62,75,.12);font-size:10.5px;font-weight:700;line-height:1.15}
.rz-jar svg{width:58px;height:58px}.rz-jar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rz-jar.inst{background:#FFFDF2}
.rz-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;justify-content:center}
.rz-slots{display:flex;gap:6px}.rz-slots.col{flex-direction:column}
.rz-st{display:flex;flex-direction:column;align-items:center;gap:1px}.rz-st small{font-size:10.5px;font-weight:700;opacity:.7}
.rz-slot{position:relative;width:88px;height:88px;border:0;background:none;padding:0;border-radius:20px}
.rz-slot .st-bg{position:absolute;inset:0;width:100%;height:100%}
.rz-slot.empty{opacity:.7}
.rz-art{position:absolute;inset:8px;display:grid;place-items:center}.rz-art>svg{width:100%;height:100%;filter:drop-shadow(0 3px 0 rgba(90,62,75,.12))}
.rz-ring{position:absolute;inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px);transform:rotate(-90deg);pointer-events:none;opacity:0}
.rz-ring circle{fill:none;stroke:#6FD3B0;stroke-width:3.4;stroke-linecap:round;stroke-dasharray:106.8;stroke-dashoffset:calc(106.8*(1 - var(--p,0)))}
.rz-slot.count .rz-ring,.rz-slot.wrap .rz-ring,.rz-slot.divide .rz-ring,.rz-slot.water .rz-ring,.rz-slot.shaking .rz-ring,.rz-slot.label .rz-ring,.rz-slot.pack .rz-ring,.rz-slot.crush .rz-ring{opacity:1}
.rz-slot.crush .rz-ring circle{stroke:#B79CFF}
.rz-slot em{position:absolute;left:50%;bottom:-8px;translate:-50% 0;font-style:normal;font-size:11px;font-weight:700;background:#fff;border-radius:999px;padding:0 8px;white-space:nowrap;box-shadow:0 2px 0 rgba(90,62,75,.12);z-index:2}
.rz-slot em.tapme{background:var(--pink);color:#fff;animation:rzbob .7s ease-in-out infinite}
.rz-slot em.bad{background:#FF7F9E;color:#fff}
.rz-slot.ready .rz-art,.rz-slot.shake .rz-art{animation:rzready 1.4s ease-in-out infinite}
.rz-slot.shake .rz-art{animation:rzwiggle .6s ease-in-out infinite}
.rz-slot.shaking .rz-art{animation:rzshake .18s linear infinite}
.rz-slot.spoiled .rz-art{filter:grayscale(.5)}
.rz-slot.pound .st-bg .pestle{animation:rzpound .2s ease}
.rz-cold{position:absolute;left:6px;right:6px;top:-6px;height:7px;border-radius:9px;background:#fff;overflow:hidden;box-shadow:0 1px 0 rgba(90,62,75,.15)}
.rz-cold i{display:block;height:100%;width:calc(var(--cold,1)*100%);background:linear-gradient(90deg,#FF8FAB,#7FC6F2 45%);border-radius:9px}
.rz-counting{position:absolute;inset:16px 22px 18px 12px}
.rz-counting i{position:absolute;width:12px;height:12px;border-radius:50%;left:calc(var(--i)*9px);top:calc(14px + (var(--i)*7px % 20px));animation:rzslide .7s ease-in-out infinite;animation-delay:calc(var(--i)*-.14s);box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}
.rz-powder{position:absolute;left:24px;right:24px;top:36px;height:12px;border-radius:50%;background:#D9C9F5;transform:scaleY(calc(.4 + var(--n,0)*.25))}
.rz-coldrow{display:flex;gap:14px;align-items:center;justify-content:center;flex:1;min-height:0}
.rz-fridge{position:relative;width:124px;height:220px;padding:16px 10px;display:flex;flex-direction:column;gap:8px;align-items:center}
.rz-fridge .fr-bg{position:absolute;inset:0;width:100%;height:100%}
.rz-jar.fr{position:relative;width:92px;background:rgba(255,255,255,.85)}
.rz-trash{position:absolute!important;right:16px;bottom:12px;width:56px;height:62px;border:0;background:#fff;border-radius:16px;box-shadow:0 4px 0 rgba(90,62,75,.12);display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:700;padding:2px}
.rz-trash svg{width:40px;height:40px}
.rz.trashing .rz-trash{background:#FF7F9E;color:#fff;animation:rzwiggle .5s ease-in-out infinite}
.rz.trashing .rz-slot:not(.empty){animation:rzwiggle .5s ease-in-out infinite}
/* juice */
.squish{animation:rzsquish .32s cubic-bezier(.3,1.6,.5,1)}
.bump{animation:rzpop .38s cubic-bezier(.3,1.7,.5,1)}
.nope{animation:rzno .3s}
.rz-fx{position:absolute!important;inset:0;pointer-events:none;z-index:6!important}
.rz-flyer{position:absolute;left:0;top:0;pointer-events:none;filter:drop-shadow(0 4px 2px rgba(90,62,75,.2))}.rz-flyer>svg{width:100%;height:100%}
.rz-float{position:absolute;translate:-50% 0;font-weight:700;font-size:22px;color:#2FA57F;text-shadow:0 2px 0 #fff,0 0 8px #fff;animation:rzfloat 1.2s ease-out forwards;white-space:nowrap}
.rz-float.bad{color:#E5536F;font-size:17px}
.rz-heart{position:absolute;width:16px;height:16px;background:#FF8FAB;transform:rotate(45deg);animation:rzheart 1.2s ease-out forwards;border-radius:3px}
.rz-heart::before,.rz-heart::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#FF8FAB}.rz-heart::before{left:-8px}.rz-heart::after{top:-8px}
.rz-toast{position:absolute;left:50%;top:300px;translate:-50% 0;background:var(--ink);color:#fff;border-radius:999px;padding:6px 16px;font-size:14px;font-weight:600;animation:rzfloat 1.3s ease-out forwards;white-space:nowrap}
.rz-banner{position:absolute;inset:0;display:grid;place-items:center}.rz-banner b{font-size:64px;font-weight:700;color:#fff;-webkit-text-stroke:3px var(--pink);text-shadow:0 6px 0 rgba(226,111,141,.5);animation:rzpop .5s cubic-bezier(.3,1.8,.5,1)}.rz-banner b.go{color:var(--butter);-webkit-text-stroke-color:#E7A92B}
.rz-conf{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:rzconf 2.6s cubic-bezier(.25,.6,.4,1) forwards}
/* hint */
.rz-hint{position:absolute!important;inset:0;z-index:7!important;pointer-events:none}
.rz-hb{position:absolute;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;background:#fff;border-radius:20px;padding:10px 14px 10px 10px;border:3px solid var(--pink);box-shadow:0 6px 0 rgba(90,62,75,.12),0 18px 40px -12px rgba(90,62,75,.5);pointer-events:auto;animation:rzpop .4s cubic-bezier(.3,1.6,.5,1)}
.rz-hm{width:46px;height:46px;border-radius:50%;overflow:hidden;background:#E5F4EE;flex:none}.rz-hm svg{width:140%;height:auto;margin:-2px 0 0 -20%}
.rz-hb p{flex:1;min-width:0;margin:2px 0 0;font-size:15px;font-weight:600;line-height:1.45}
.rz-hb .rz-b{margin-left:auto}
.rz-hand{position:absolute;width:40px;height:48px;animation:rzpoint 1s ease-in-out infinite;filter:drop-shadow(0 3px 2px rgba(90,62,75,.3))}.rz-hand svg{width:100%;height:100%}
.rz-glow{box-shadow:0 0 0 4px #fff,0 0 0 8px var(--pink)!important;border-radius:20px;z-index:5}
/* cards / overlays */
.rz-ov{position:absolute!important;inset:0;z-index:8!important;background:rgba(90,62,75,.32);display:grid;place-items:center;padding:14px}
.rz-ov[hidden]{display:none}
.rz-card{position:relative;width:min(560px,94%);max-height:96%;overflow:auto;background:#FFF9F3;border-radius:30px;padding:20px 22px 18px;box-shadow:0 8px 0 rgba(90,62,75,.12),0 30px 60px -20px rgba(90,62,75,.45);animation:rzpop .45s cubic-bezier(.3,1.5,.5,1)}
.rz-card.sm{width:min(440px,94%)}
.rz-card h2{margin:0 0 8px;font-size:27px;line-height:1.2}
.rz-kick{color:var(--pink);font-weight:700;font-size:13.5px}
.rz-sub{color:#9A8590;font-size:13.5px;margin:0}
.rz-row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.rz-b{border:0;border-radius:999px;padding:10px 22px;font-weight:700;font-size:15px;background:var(--pink);color:#fff!important;box-shadow:0 4px 0 #E26F8D;display:inline-flex;align-items:center;gap:6px;transition:transform .1s}
.rz-b.big{padding:12px 28px;font-size:17px}.rz-b.sm{padding:6px 14px;font-size:13.5px}
.rz-b.ghost{background:#fff;color:var(--ink)!important;box-shadow:0 4px 0 rgba(90,62,75,.12)}
.rz-b.dis{opacity:.45}.rz-b:active{transform:translateY(3px);box-shadow:none}
.rz-goalbox{background:#fff;border-radius:16px;padding:9px 14px;font-size:16px;font-weight:700;margin:4px 0 8px;border-left:6px solid var(--pink)}.rz-goalbox b{display:block;font-size:12px;color:var(--pink)}
.rz-goalbox.bad{border-left-color:#E5536F}
.rz-new{background:#fff;border-radius:18px;padding:10px 12px;margin:6px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rz-new p{flex-basis:100%;margin:0;font-size:14px;font-weight:600}
.rz-newtag{background:#7FC8B0;color:#fff;border-radius:999px;padding:1px 10px;font-weight:700;font-size:12px}
.rz-ni{display:flex;align-items:center;gap:6px;background:#FFF5F8;border-radius:14px;padding:3px 10px 3px 4px}.rz-ni svg{width:44px;height:44px}.rz-ni b{display:block;font-size:13.5px}.rz-ni small{font-size:11px;color:#9A8590}
.rz-goal{display:flex;flex-wrap:wrap;gap:8px;font-size:13.5px;margin:8px 0 2px}.rz-goal span{display:inline-flex;align-items:center;gap:3px;background:#fff;border-radius:999px;padding:3px 10px 3px 6px;font-weight:600}
.rz-goal svg,.rz-bigstars svg,.rz-node span svg{fill:#EADDE2}.rz-goal svg{width:14px;height:14px}.rz-goal svg.on,.rz-bigstars svg.on,.rz-node span svg.on{fill:#FFC93C}
.rz-bigstars{display:flex;justify-content:center;gap:8px;margin:2px 0 10px}.rz-bigstars svg{width:58px;height:58px;filter:drop-shadow(0 3px 0 rgba(90,62,75,.12))}
.rz-bigstars svg.on{animation:rzpop .55s cubic-bezier(.3,1.8,.5,1) backwards}.rz-bigstars svg.on:nth-child(2){animation-delay:.18s}.rz-bigstars svg.on:nth-child(3){animation-delay:.36s}
.rz-res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:8px}.rz-res div{background:#fff;border-radius:16px;padding:8px 6px;text-align:center}.rz-res b{display:flex;justify-content:center;align-items:center;gap:4px;font-size:22px}.rz-res span{font-size:12px;color:#9A8590}
.rz-tip{background:#fff;border-radius:16px;padding:8px 12px;font-size:14px;line-height:1.5}.rz-tip b{display:block;color:#5DBE9C;font-size:13px}
.rz-chat{display:flex;gap:10px;align-items:center}.rz-face{width:76px;height:86px;flex:none}.rz-face svg{width:100%;height:100%}
.rz-chat p{margin:0;background:#fff;border-radius:18px;padding:10px 14px;font-size:16px;font-weight:600}
.rz-tagline{display:flex;gap:8px;align-items:center;background:#FFF0F0;border-radius:16px;padding:6px 12px;margin:10px 0}.rz-tagline svg{width:44px;height:44px}.rz-tagline b{display:block}.rz-tagline span{font-size:13px}
.rz-choices{display:grid;gap:8px}.rz-choices .rz-b{justify-content:center;text-align:center}

(()=>{

    else if(x.ph==='label'){x.p=Math.min(1,x.t/RZT.label);if(x.p>=1){x.ph='ready';x.t=0;x.p=0;rzSlotUpd('mix',k);RZS.pop();rzEv('mixReady')}}

}

/* ---------- loop ---------- */
function rzLoop(now){
  if(!RZ||!RZ.run)return;const dt=Math.min(.1,(now-RZ.last)/1000);RZ.last=now;
  if(RZ.tut.cur){rzHintPlace();if(RZ.tut.cur&&!RZ.tut.cur.ok&&now-RZ.tut.t0>9000)rzHintNext()}
  if(!RZ.paused&&RZ.hold<2){
    rzTickStations(dt);rzComboTick(dt);
    RZ.seats.forEach((c,j)=>{if(!c)return;if(c.leave){c.lt-=dt;if(c.lt<=0){RZ.seats[j]=null;rzSeat(j)}}else if(c.walk>0){c.walk-=dt;if(c.walk<=0)rzArrive(j)}});
    if(!RZ.hold){RZ.T+=dt;rzSpawn();rzQueueTick(dt);
      RZ.seats.forEach((c,j)=>{if(!c||c.leave||c.walk>0)return;
        if(!RZ.fever)c.pat-=dt*(c.vip?1.1:1);const m=rzMood(c);if(m!==c.mood){c.mood=m;rzSeat(j);if(m==='angry')RZS.nope()}
        const bar=rzQ(`#rzS${j} .rz-pat i`);if(bar){const f=c.pat/c.pm;bar.style.width=Math.max(0,f*100)+'%';bar.style.background=f>.6?'#7FD8B6':f>.3?'#FFCF5C':'#FF7F9E'}
        if(c.pat<=0){RZ.missed++;rzComboBreak(true);rzFloat(rzQ('#rzS'+j),'รอไม่ไหวแล้ว!','bad');RZS.sad();c.mood='angry';rzExit(j,'angry');rzHUD();if(RZ.V.goal.t==='nolose')rzFail('มีลูกค้ารอจนกลับไป')}});
      if(!RZ.done&&RZ.qi>=RZ.V.cs.length&&!RZ.queue.length&&RZ.seats.every(s=>!s)){RZ.ending+=dt;if(RZ.ending>.6){rzFail('ลูกค้าหมดก่อนถึงเป้า');}}}
    rzStarClock();
  }
  requestAnimationFrame(rzLoop);
}

/* ---------- trap: patient asks to crush an enteric-coated tablet ---------- */
function rzTrap(j){
  const c=RZ.seats[j];if(!c)return;const o=c.order.find(o=>o.trap&&!o.res);if(!o)return;RZ.hold=3;
  const box=rzQ('#rzOv');box.hidden=false;
  box.innerHTML=`<div class="rz-card sm"><div class="rz-chat"><div class="rz-face">${czPerson(c.look,'calm')}</div><p>“ช่วยบดแอสไพรินให้หน่อยได้ไหม กลืนยาเม็ดไม่ค่อยลง”</p></div>
   <div class="rz-tagline">${rzArt('asa','bag')}<span><b>แอสไพรินเคลือบลำไส้ (EC)</b>เม็ดเคลือบพิเศษ</span></div>
   <div class="rz-choices"><button class="rz-b ghost" data-r="trap" data-v="crush" data-i="${j}">บดให้เลย</button><button class="rz-b" data-r="trap" data-v="ok" data-i="${j}">อธิบายว่ายานี้ห้ามบด แนะนำให้กลืนทั้งเม็ด</button></div></div>`;

function rzTrapRes(j,v){
  const c=RZ.seats[j];rzQ('#rzOv').hidden=true;RZ.hold=0;RZ.last=performance.now();if(!c)return;const o=c.order.find(o=>o.trap&&!o.res);if(!o)return;
  if(v==='ok'){o.res='ok';RZS.ok();rzStat('trap');rzFloat(rzQ('#rzS'+j),'+10 คำแนะนำดีมาก','good');c.pat=Math.min(c.pm,c.pat+c.pm*.25)}
  else{o.res='crush';o.done=true;o.bad=true;RZS.nope()}
  rzSeat(j);rzCheck(j);rzEv('trapRes');
}

  if(r==='msclaim'){const m=RZ_MS.find(x=>x.k===b.dataset.k),t=rzMsTier(m);if(t<m.n.length&&rzMsVal(m)>=m.n[t]){RD.ms[m.k]=t+1;rzClaim(100*(t+1),b)}rzQuests('ms');return}

  if(r==='stab'){rzShop(b.dataset.t);return}
  if(r==='dbuy'){rzDBuy(b.dataset.id);return}
  if(r==='map'){rzMap();return}
  if(r==='shop'){rzShop();return}
  if(r==='buy'){rzBuy(b.dataset.id);return}

  if(r==='hok'){RZS.tap();rzHintNext();return}
  if(r==='mhok'){rzMapHintDone();return}
  if(r==='pause'){rzPause();return}
  if(r==='resume'){RZ.paused=false;RZ.last=performance.now();rzQ('#rzOv').hidden=true;RZS.music(true);requestAnimationFrame(rzLoop);return}
  if(r==='trap'){rzTrapRes(+b.dataset.i,b.dataset.v);return}
  if(!RZ||!RZ.run||RZ.paused||RZ.hold===2||RZ.hold===3)return;
  if(RZ.tut.cur&&RZ.tut.cur.ok)return;
  if(r==='trash'){RZ.trash=!RZ.trash;rzEl.classList.toggle('trashing',RZ.trash);RZS.tap();if(RZ.trash)rzNope('แตะของที่จะทิ้ง',null);return}
  if(r==='src'){if(RZ.trash){RZ.trash=false;rzEl.classList.remove('trashing')}rzTapSrc(b.dataset.id,b);return}

  if(T.cur){if(T.cur.until===ev)rzHintNext();return}
  const st=T.steps[T.k];if(st&&st.on===ev)setTimeout(()=>{if(RZ&&RZ.run&&!RZ.tut.cur&&RZ.tut.steps[RZ.tut.k]===st)rzHintShow(st)},120);

  rzSave();RZS.ok();rzBuild2(id)}

const rzToday=()=>{const d=new Date();return`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`};
function rzQEnsure(){
  const day=rzToday();if(RD.q&&RD.q.day===day)return RD.q;
  const max=rzMaxL(),R=rzRng(day.split('-').reduce((a,b)=>a*37+ +b,7)),pool=RZ_QP.filter(q=>q.L<=max),list=[];
  while(list.length<3&&pool.length){const q=pool.splice(Math.floor(R()*pool.length),1)[0],tier=Math.min(2,Math.floor(R()*3*Math.min(1,max/10)));list.push({k:q.k,n:q.n[tier],tier,p:0,c:0})}
  RD.q={day,list,bonus:0};rzSave();return RD.q;
}
const rzQReward=q=>Math.round((50+Math.min(60,rzMaxL())*5)*(1+q.tier*.6)/5)*5;
function rzStat(k,n=1,isMax){
  RD.life[k]=isMax?Math.max(RD.life[k]||0,n):(RD.life[k]||0)+n;
  const upd=Q=>Q.list.forEach(q=>{if(q.k===k&&!q.c){const def=RZ_QP.find(x=>x.k===k);q.p=def&&def.max?Math.max(q.p,n):q.p+n}});
  const Q=RD.q;if(Q&&Q.day===rzToday())upd(Q);const W=RD.w;if(W&&W.wk===rzWeek())upd(W);
}
/* weekly quests: bigger goals, reset every Monday */
const rzWeek=()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`};
function rzWEnsure(){
  const wk=rzWeek();if(RD.w&&RD.w.wk===wk)return RD.w;
  const max=rzMaxL(),R=rzRng(wk.split('-').reduce((a,b)=>a*41+ +b,11)),pool=RZ_QP.filter(q=>q.L<=max&&q.k!=='combo'),list=[];
  while(list.length<4&&pool.length){const q=pool.splice(Math.floor(R()*pool.length),1)[0];list.push({k:q.k,n:q.n[2]*(q.k==='star3'||q.k==='clear'?3:4),tier:3,p:0,c:0})}
  RD.w={wk,list,bonus:0};rzSave();return RD.w;
}
const rzWReward=()=>Math.round((200+Math.min(60,rzMaxL())*12)/5)*5;
const rzQBonus=()=>150+rzMaxL()*5,rzWBonus=()=>600+rzMaxL()*15;
/* what can be collected right now, per tab */
function rzPend(tab){
  if(tab==='day'){const Q=rzQEnsure();let v=Q.list.filter(q=>rzQDone(q)&&!q.c).reduce((a,q)=>a+rzQReward(q),0);if(!Q.bonus&&Q.list.every(q=>q.c||rzQDone(q)))v+=rzQBonus();return v}
  if(tab==='week'){const W=rzWEnsure();let v=W.list.filter(q=>rzQDone(q)&&!q.c).length*rzWReward();if(!W.bonus&&W.list.every(q=>q.c||rzQDone(q)))v+=rzWBonus();return v}
  let v=0;RZ_MS.forEach(m=>{let t=rzMsTier(m);while(t<m.n.length&&rzMsVal(m)>=m.n[t]){v+=100*(t+1);t++}});return v;
}
function rzClaimAll(tab){
  const v=rzPend(tab);if(!v){RZS.nope();return}
  if(tab==='day'){const Q=RD.q;Q.list.forEach(q=>{if(rzQDone(q))q.c=1});if(Q.list.every(q=>q.c))Q.bonus=1}
  else if(tab==='week'){const W=RD.w;W.list.forEach(q=>{if(rzQDone(q))q.c=1});if(W.list.every(q=>q.c))W.bonus=1}
  else RZ_MS.forEach(m=>{let t=rzMsTier(m);while(t<m.n.length&&rzMsVal(m)>=m.n[t])t++;RD.ms[m.k]=t});
  RD.wallet+=v;rzSave();RZS.coin();RZS.ok();rzQuests(tab,v);
}
const rzQDone=q=>q.p>=q.n;
const rzMsTier=m=>RD.ms[m.k]||0,rzMsVal=m=>m.k==='codex'?Object.keys(RD.cx).length:(RD.life[m.k]||0);
const rzQClaimable=()=>rzPend('day')+rzPend('week')+rzPend('ms')>0;
const rzQClaimableOld=()=>{const Q=rzQEnsure();return Q.list.some(q=>rzQDone(q)&&!q.c)||(!Q.bonus&&Q.list.every(q=>q.c))||RZ_MS.some(m=>rzMsTier(m)<m.n.length&&rzMsVal(m)>=m.n[rzMsTier(m)])};

  hand.style.left=(r.x+r.w/2-8)+'px';hand.style.top=(r.y+r.h*.55)+'px';b.style.width=bw+'px';
  b.style.left=Math.max(12,Math.min(W-bw-12,r.x+r.w/2-bw/2))+'px';
  if(r.y>H*.5)b.style.bottom=(H-r.y+16)+'px';else b.style.top=(r.y+r.h+50)+'px';
  RZS.pop();
}

/* ---------- shop ---------- */
function rzShop(tab){
  const max=rzMaxL();RZS.tap();const su=RD.seenUp||(RD.seenUp={});if(tab==null)tab=RD.seen.dup===1?'gear':'gear';
  const o=rzQ('#rzOv')||rzEl;o.hidden=false;const dupOn=rzOpen('dup');
  o.innerHTML=`<div class="rz-card shop"><div class="rz-shoph"><h2>ร้านค้าอัปเกรด</h2><span class="rz-pill coin"><i class="rz-coin"></i><b>${RD.wallet}</b></span></div>
   ${dupOn?`<div class="rz-tabs"><button class="${tab==='gear'?'on':''}" data-r="stab" data-t="gear">อุปกรณ์ร้าน</button><button class="${tab==='drug'?'on':''} ${RD.seen.dup===1?'dotb':''}" data-r="stab" data-t="drug">อัปเกรดยา</button></div>`:''}
   ${tab==='drug'?rzShopDrugs():`<div class="rz-ups">${RZ_UP.map(u=>{const lv=RD.up[u.id]||0,maxed=lv>=u.v.length-1,lock=max<u.need,cost=maxed?0:u.c[lv+1];
     return`<div class="rz-up ${lock?'lock':''}"><div class="rz-upi">${RZ_UPI[u.id]||''}</div><div class="rz-upt"><b>${u.n}${!lock&&!su[u.id]?'<small class="rz-newb">ใหม่</small>':''}</b><span>${lock?`ปลดล็อกด่าน ${u.need}`:u.d}</span><i>${u.v.slice(1).map((_,k)=>`<em class="${k<lv?'on':''}"></em>`).join('')}</i></div>
      ${lock?'':maxed?'<span class="rz-max">สูงสุด</span>':`<button class="rz-b sm ${RD.wallet<cost?'dis':''}" data-r="buy" data-id="${u.id}"><i class="rz-coin"></i>${cost}</button>`}</div>`}).join('')}</div>`}
   <div class="rz-row"><button class="rz-b" data-r="map">กลับแผนที่</button></div></div>`;
  RZ_UP.forEach(u=>{if(max>=u.need)su[u.id]=1});rzSave();
  const h=rzQ('#rzHint');if(h){h.hidden=true;h.innerHTML=''}
  if(RD.seen.shop===1)setTimeout(()=>rzPoint(rzEl.querySelector('[data-r="buy"][data-id="speed"]'),'ลองอัปเกรด “ไม้พายนับยาสปีด” ดูนะ ยาเม็ดจะนับเสร็จเร็วขึ้นทุกด่าน',''),350);
  if(RD.seen.dup===1&&RD.seen.shop>=3){if(tab!=='drug')setTimeout(()=>rzPoint(rzEl.querySelector('[data-r="stab"][data-t="drug"]'),'แท็บใหม่! แตะ “อัปเกรดยา”',''),300);else{const b=rzEl.querySelector('[data-r="dbuy"]:not(.dis)')||rzEl.querySelector('[data-r="dbuy"]');if(b)setTimeout(()=>rzPoint(b,'อัปเกรดบริการของยาที่ขายบ่อย ทุกครั้งที่ขายจะได้เงินมากขึ้น',''),300)}}
  if(RD.seen.shop===2)setTimeout(()=>rzPoint(rzEl.querySelector('.rz-card.shop [data-r="map"]'),'เยี่ยม! ของที่อัปเกรดแล้วใช้ได้ตลอด กลับไปที่แผนที่กัน',''),350);
}
function rzBuy(id){const u=RZ_UP.find(x=>x.id===id),lv=RD.up[id]||0,cost=u.c[lv+1];if(cost==null)return;if(RD.wallet<cost){RZS.nope();return}
  RD.wallet-=cost;RD.up[id]=lv+1;if(RD.seen.shop===1)RD.seen.shop=2;rzSave();RZS.ok();rzShop();const el=rzEl.querySelector(`[data-id="${id}"]`)||rzEl.querySelector('.rz-ups');bounce(el&&el.closest('.rz-up'))}
const RZ_UPI={tray:'<svg viewBox="0 0 40 40"><rect x="4" y="12" width="32" height="20" rx="6" fill="#FFE7D2" stroke="#F3B98F" stroke-width="2"/><circle cx="13" cy="22" r="3" fill="#FF9DB8"/><circle cx="21" cy="22" r="3" fill="#8FCBFF"/><circle cx="29" cy="22" r="3" fill="#B9A4FF"/></svg>',
 speed:'<svg viewBox="0 0 40 40"><path d="M22 4L8 22h10l-2 14 16-20H22Z" fill="#FFD84D" stroke="#E7A92B" stroke-width="2" stroke-linejoin="round"/></svg>',
 mixer:'<svg viewBox="0 0 40 40"><rect x="13" y="4" width="14" height="6" rx="2" fill="#D9895E"/><rect x="9" y="10" width="22" height="26" rx="8" fill="#FFAE7F"/><rect x="13" y="18" width="14" height="9" rx="3" fill="#fff"/></svg>',
 sofa:'<svg viewBox="0 0 40 40"><rect x="6" y="12" width="28" height="14" rx="6" fill="#CDB4FF"/><rect x="2" y="18" width="36" height="12" rx="6" fill="#B79CFF"/><rect x="6" y="30" width="4" height="5" rx="1" fill="#9A84D8"/><rect x="30" y="30" width="4" height="5" rx="1" fill="#9A84D8"/></svg>',
 tip:'<svg viewBox="0 0 40 40"><circle cx="20" cy="22" r="14" fill="#FFE29A"/><path d="M9 12l3-8 5 6M31 12l-3-8-5 6" fill="#FFE29A"/><circle cx="15" cy="21" r="1.8" fill="#5A3E4B"/><circle cx="25" cy="21" r="1.8" fill="#5A3E4B"/><path d="M17 26q3 3 6 0" stroke="#5A3E4B" stroke-width="1.8" fill="none"/><rect x="16" y="9" width="8" height="3" rx="1.5" fill="#E7A92B"/></svg>',
 ice:'<svg viewBox="0 0 40 40"><rect x="6" y="10" width="28" height="22" rx="7" fill="#BFE3FF" stroke="#7FBCEB" stroke-width="2"/><path d="M20 14v14M14 17l12 8M14 25l12-8" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>',
 pack:'<svg viewBox="0 0 40 40"><rect x="3" y="14" width="16" height="18" rx="5" fill="#BFE3FF"/><rect x="21" y="14" width="16" height="18" rx="5" fill="#BFE3FF"/><path d="M11 18v10M27 18v10" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>',
 bell:'<svg viewBox="0 0 40 40"><path d="M20 5a3 3 0 0 1 3 3v1a11 11 0 0 1 8 11v7l3 4H6l3-4v-7a11 11 0 0 1 8-11V8a3 3 0 0 1 3-3Z" fill="#FFD84D" stroke="#E7A92B" stroke-width="2"/><circle cx="20" cy="34" r="3.5" fill="#E7A92B"/><path d="M33 6l2 3 3 1-3 1-2 3-1-3-3-1 3-1Z" fill="#FF8FAB"/></svg>',
 mortar:'<svg viewBox="0 0 40 40"><path d="M6 20h28q-2 14-14 15Q8 34 6 20Z" fill="#F2E3EC" stroke="#D7B7C6" stroke-width="2"/><rect x="22" y="3" width="6" height="20" rx="3" fill="#E9CFDB" transform="rotate(25 25 13)"/><path d="M31 6l2 3 3 1-3 1-2 3-1-3-3-1 3-1Z" fill="#FFD84D"/></svg>'};

/* ---------- level intro / end ---------- */
function rzIntro(L){
  if(RZ){RZ.run=false;RZ=null}const V=RZ_NEXT=rzLevel(L,(Math.random()*1e9)|0);
  const ch=RZ_CHC[V.ch%RZ_CHC.length];rzEl.style.setProperty('--wall1',ch[0]);rzEl.style.setProperty('--wall2',ch[1]);
  rzEl.innerHTML=`<div class="rz-bg">${rzDeco()}</div><div class="rz-ov"><div class="rz-card intro"><div class="rz-kick">${RZ_CH[V.ch%RZ_CH.length]} · ด่าน ${L}</div>
   <h2>${L%10===0?'ด่านบอส! ':''}${RZ_GOALTXT(V)}</h2>
   <div class="rz-goalbox"><b>เป้าหมาย · ทำครบแล้วจบด่านทันที</b>${RZ_GOALTXT(V)}${V.goal.t==='nolose'?'':` · มีลูกค้าทั้งหมด ${V.n} คน`}</div>
   ${V.news.length?`<div class="rz-new"><span class="rz-newtag">ของใหม่</span>${V.fresh.map(x=>`<div class="rz-ni">${rzOrderArt(x)}<div><b>${RI[x].n}</b><small>${RI[x].e}</small></div></div>`).join('')}${V.news.map(u=>u.txt?`<p>${u.txt}</p>`:'').join('')}</div>`:''}
   <div class="rz-goal"><span>${czStars(3)} เสร็จภายใน ${rzFmt(V.par[0])}</span><span>${czStars(2)} ภายใน ${rzFmt(V.par[1])}</span><span>${czStars(1)} ทำเป้าหมายสำเร็จ</span></div>
   <div class="rz-row"><button class="rz-b ghost" data-r="map">แผนที่</button><button class="rz-b big" data-r="go" data-l="${L}">เริ่มเลย!</button></div></div></div>`;
}
function rzEnd(pass,why){
  RZ.run=false;const V=RZ.V,L=RZ.L;
  const stars=pass?(RZ.T<=V.par[0]?3:RZ.T<=V.par[1]?2:1):0;
  if(pass){rzStat('clear');if(stars===3)rzStat('star3')}rzStat('coins',RZ.coins);rzStat('combo',RZ.best,true);
  const wasMax=rzMaxL();RD.stars[L-1]=Math.max(RD.stars[L-1]||0,stars);RD.best[L-1]=Math.max(RD.best[L-1]||0,RZ.coins);RD.wallet+=Math.round(RZ.coins*(rzG('fire')?1.05:1));rzSave();
  RZS.music(false);
  const fx=pick(V.fresh.length?V.fresh:V.items),o=rzQ('#rzOv');o.hidden=false;
  o.innerHTML=`<div class="rz-card end ${pass?'win':''}"><div class="rz-kick">ด่าน ${L}</div><h2>${pass?['ผ่านแล้ว!','เก่งมาก!','สุดยอดเภสัช!'][stars-1]:'ยังไม่ผ่าน ลองอีกครั้งนะ'}</h2>
   <div class="rz-bigstars">${czStars(stars)}</div>
   ${pass?`<p class="rz-sub" style="text-align:center">ใช้เวลา ${rzFmt(RZ.T)} · ${stars<3?`3 ดาวต้องเสร็จภายใน ${rzFmt(V.par[0])}`:'เร็วสุด ๆ!'}</p>`:`<div class="rz-goalbox bad"><b>${why||'เป้าหมาย'}</b>${RZ_GOALTXT(V)}</div>`}
   <div class="rz-res"><div><b><i class="rz-coin"></i>${RZ.coins}</b><span>เข้ากระเป๋าแล้ว</span></div><div><b>${RZ.served}</b><span>ลูกค้าได้ยา${RZ.missed?` · พลาด ${RZ.missed}`:''}</span></div><div><b>×${RZ.best}</b><span>คอมโบสูงสุด${RZ.fevers?` · ไฟลุก ${RZ.fevers} ครั้ง`:''}</span></div></div>
   <div class="rz-tip"><b>รู้ไหม</b>${RZ_FACT[fx]||''}</div>
   <div class="rz-row"><button class="rz-b ghost" data-r="map">แผนที่</button><button class="rz-b ${pass?'ghost':'big'}" data-r="go" data-l="${L}">เล่นอีกครั้ง</button>${pass?(rzPending()&&rzMaxL()>wasMax?`<button class="rz-b big" data-r="map">ปลดล็อก${rzPending().n}! ไปดูกัน</button>`:`<button class="rz-b big" data-r="lv" data-l="${L+1}">ด่านต่อไป</button>`):''}</div></div>`;
}

rzSplash();
})();
</script>
